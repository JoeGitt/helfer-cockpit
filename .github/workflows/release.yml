name: Release
on:
  push:
    tags: ["v*"]
jobs:
  paket:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tests
        run: pip install -q openpyxl keyring pytest && python -m pytest -q
      - name: Version prüfen
        run: |
          V=$(python -c "from cockpit.version import VERSION; print(VERSION)")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} passt nicht zu VERSION $V"; exit 1; }
      - name: Windows-Paket bauen
        run: python packaging/build_release.py
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HelferCockpit-*-windows.zip
          generate_release_notes: true
